name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build arm64 DMG
        run: ./build.sh --dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "F50 Monitor.app/Contents/Info.plist")
          dmg_path="dist/F50-Monitor-${version}-arm64.dmg"
          checksum=$(shasum -a 256 "$dmg_path" | awk '{print $1}')
          printf '%s  %s\n' "$checksum" "$(basename "$dmg_path")" > "${dmg_path}.sha256"

          notes_path="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_path" <<EOF
          ## 下载与安装

          下载下方 **$(basename "$dmg_path")**，打开后将 **F50 Monitor** 拖入「应用程序」。支持 Apple 芯片 Mac、macOS 13 及以上。

          ## 更新内容

          - 网络模式切换会回读设备状态确认结果，避免丢失响应时重复提交。
          - 切换网络期间忽略过期轮询结果，避免旧状态覆盖新网络与频段信息。
          - 修正跨日时把上一会话流量计入当日用量的问题。

          SHA-256：
          \`\`\`text
          $checksum
          \`\`\`
          EOF

          gh release create "v${version}" "$dmg_path" "${dmg_path}.sha256" \
            --title "F50 Monitor v${version} — 网络切换与流量统计修正" \
            --notes-file "$notes_path" \
            --verify-tag
